<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Scheme</title>
<style>body{margin:0;font:700 40px/1.3 -apple-system,system-ui;padding:120px 24px;background:#f2f2f2;color:#111}
@media (prefers-color-scheme: dark){body{background:#101010;color:#5fe08a}}</style>
</head><body><div id="s"></div>
<script>
const q = matchMedia('(prefers-color-scheme: dark)');
const show = () => { document.getElementById('s').textContent = q.matches ? 'DARK' : 'LIGHT'; document.title = q.matches ? 'Scheme dark' : 'Scheme light'; };
q.addEventListener('change', show);
show();
</script></body></html>
